<figure class="carte">
<svg viewBox="0 0 760 330" role="img" aria-labelledby="carte-titre carte-desc" class="carte-svg">
  <title id="carte-titre">Le fleuve, de l'amont à Vasque</title>
  <desc id="carte-desc">Les Vergers hauts, Hauteroche, le bac haut, Bas-Gué et Vasque, alignés sur le fleuve. Chaque tronçon est chiffré en jours de remontée.</desc>

  <!-- eau -->
  <path class="eau-large" d="M12,88 C120,72 180,126 268,132 C356,138 400,96 486,110 C572,124 610,196 700,214 L748,222"/>
  <path class="eau-fine" d="M12,104 C120,90 186,142 270,148 C354,154 398,112 484,126 C570,140 606,212 698,230 L748,238"/>
  <path class="eau-fine" d="M14,74 C122,58 176,110 266,116 C356,122 402,80 488,94 C574,108 614,180 702,198 L748,206"/>

  <!-- roseaux -->
  <g class="roseau">
    <path d="M96,150 q6,-22 2,-38"/><path d="M104,152 q10,-18 12,-30"/>
    <path d="M330,118 q4,-20 0,-34"/><path d="M340,120 q9,-16 12,-26"/>
    <path d="M620,236 q5,-22 1,-36"/><path d="M630,238 q10,-18 13,-28"/>
  </g>

  <!-- points -->
  <g class="lieu">
    <circle class="pastille" cx="40" cy="86" r="7"/>
    <text class="nom" x="40" y="62">Les Vergers hauts</text>
    <text class="tag" x="40" y="46">amont</text>
  </g>
  <g class="lieu">
    <circle class="pastille" cx="200" cy="112" r="7"/>
    <text class="nom" x="200" y="182">Hauteroche</text>
    <text class="tag" x="200" y="198">le moulin</text>
  </g>
  <g class="lieu">
    <circle class="pastille" cx="372" cy="128" r="7"/>
    <text class="nom" x="372" y="102">Le bac haut</text>
    <text class="tag" x="372" y="86">Bourdaine, passeur</text>
  </g>
  <g class="lieu lieu-cite">
    <circle class="pastille pastille-forte" cx="540" cy="140" r="11"/>
    <text class="nom nom-fort" x="540" y="206">Bas-Gué</text>
    <text class="tag" x="540" y="222">le gué, le tribunal, la Gousse</text>
  </g>
  <g class="lieu">
    <circle class="pastille" cx="712" cy="222" r="7"/>
    <text class="nom" x="700" y="286">Vasque</text>
    <text class="tag" x="700" y="302">aval · les guildes</text>
  </g>

  <!-- distances : remontée -->
  <g class="mesure">
    <text x="118" y="126">1 j ↑</text>
    <text x="286" y="140">1 j ↑</text>
    <text x="456" y="152">½ j ↑</text>
    <text x="628" y="204">2 j ↑</text>
  </g>

  <!-- sens du courant -->
  <g class="courant">
    <path d="M40,262 L690,262"/>
    <path d="M690,262 l-10,-5.5 l0,11 z" class="pointe"/>
    <text x="300" y="252">le courant descend vers Vasque</text>
    <text x="140" y="286">↑ les chiffres sont ceux de la remontée — descendre coute la moitié</text>
  </g>
</svg>
<figcaption>Tout se compte en <strong>jours de fleuve</strong>. Les chiffres portés sont ceux de la <em>remontée</em> ; descendre coute la moitié.</figcaption>
</figure>
